<script>
const source='https://stpetersburg.curriqunet.com/DynamicReports/AllFieldsReportByEntity/9944?entityType=Course&reportId=50';
// Short objective labels paraphrase the approved outline. Numeric IDs follow its hierarchy.
const outcomes=[['Scientific reasoning','Critical thinking & scientific standards'],['Earth science evidence','Data analysis & valid conclusions'],['Earth through time','Processes across different time scales'],['People & Earth systems','Interactions with Earth’s spheres'],['Local & global issues','Applying Earth science principles']];
const objectives=[['1.1','Scientific method'],['1.2','Evaluate measurement methods'],['2.1','Rock and mineral identification'],['2.2','Interpret topographic and geologic maps'],['2.3','Surface-shaping processes'],['2.4','Geologic dating methods'],['2.5','Seawater chemistry and motion'],['2.6','Solar system structure'],['2.7','Earth–Moon system'],['3.1','Evaluate evolution and extinction causes'],['3.2','Tectonic events and their forces'],['3.3','Geologic time scale and event placement'],['3.4','Origins of the universe and solar system'],['4.1','Compare marine life'],['4.2','Analyze ocean-floor features'],['4.3','History of astronomical thought'],['5.1','Atmospheric measurement'],['5.2','Weather map components'],['5.3','Climate-system function and change']];
const assignments=[
{id:'time',module:1,title:'Geologic Time Scale Concept Sketch',short:'Geologic Time',type:'Concept sketch',points:'50 points',summary:'Place 10 events in Earth’s history and explain possible causes of two mass extinctions.',product:'One labeled time-scale sketch with dates, intervals, 10 events, and written explanations for the end-Permian and K–T / K–Pg extinctions.',criteria:'50 points total. A completion checklist is supplied; an analytic scoring rubric and criterion weights are not supplied.',strength:'The required sketch makes event placement visible. The two extinction explanations add causal reasoning to the chronology.',action:'Add a short comparison of competing extinction explanations and the evidence supporting each. If memorization is required, add a brief unaided time-scale check.',note:'Numbering correction: the supplied assignment lists time-scale placement as the second item under outcome 3. Its approved-outline ID is 3.3. Research-supported placement does not, by itself, assess memorization.',dimensions:[['Objective fit',4,'The required products directly address 3.1 and 3.3, with limits on evaluation and recall.'],['Cognitive match',3,'Explaining possible causes and placing researched dates stop short of evaluating evidence and demonstrating memorization.'],['Observable evidence',4,'The sketch and explanations provide visible evidence for the mapped objectives.'],['Scoring transparency',3,'The checklist is clear, but point allocations and quality descriptors are missing.']],maps:[['3.1',4,'Declared','Students explain possible causes of the end-Permian and K–T / K–Pg extinctions. This is direct causal work; evaluating competing theories is not explicitly required.','Require students to compare two causal explanations and judge their evidentiary support.'],['3.3',4,'Declared','Ten dated events must be placed in the correct intervals on a labeled geologic time scale. Sources are allowed, so unaided recall is not demonstrated.','Score event placement separately from time-scale recall, if recall remains an intended target.']]},
{id:'figures',module:1,title:'Historical Figures in the Geosciences',short:'Historical Figures',type:'Discussion',points:'Points not supplied',summary:'Research a minority or woman geoscientist, explain their contribution, and reflect on representation.',product:'A biographical paragraph, reflection on representation, a reference, and two thoughtful peer replies. Describing the scientist’s evidence is required only if available in the source.',criteria:'The assignment refers to separate Discussion Guidelines; those grading criteria were not supplied for this review.',strength:'An inclusive entry point into the discipline that can help students connect scientific contributions with the people who made them.',action:'Make evidence analysis required for every choice: identify a research question, explain the method, compare measurement approaches, and evaluate a conclusion. Use topic-specific prompts only where the selected scientist makes them relevant.',note:'The representation reflection has instructional value, but it is not a direct match to a specific supporting objective in this outline. A topic being mentioned does not establish the required scientific performance.',dimensions:[['Objective fit',2,'The topic supports the discipline, but most mapped scientific performances are not mandatory.'],['Cognitive match',2,'Biographical description does not require explaining scientific-method steps or evaluating measurement methods.'],['Observable evidence',2,'Scientific evidence is optional when unavailable, and specialized content depends on student choice.'],['Scoring transparency',null,'The referenced Discussion Guidelines were not provided; scoring alignment cannot be judged.']],maps:[['1.1',2,'Declared','Students describe a contribution and may describe evidence, but they do not have to explain scientific-method steps or principles.','Require a research question, method, evidence, conclusion, and limitation.'],['1.2',2,'Declared','Measurements may be described if source information is available; evaluating different methods is not required.','Require comparison of two methods and a reasoned judgment about their strengths.'],['2.2',2,'Conditional','A scientist may have used maps, but students are not required to interpret a topographic or geologic map themselves.','For map-based choices, supply a map interpretation task.'],['2.5',2,'Conditional','An oceanographer’s biography may touch on seawater; chemistry and circulation are not guaranteed in the response.','For relevant choices, require an explanation of chemistry or circulation.'],['3.1',2,'Conditional','A paleontologist may have studied extinction, but evaluating causal theories is not a universal requirement.','For relevant choices, require comparison of extinction or evolutionary explanations.'],['3.2',2,'Conditional','A selected scientist may have studied tectonics, but distinguishing events by their driving forces is not required.','For relevant choices, ask students to distinguish tectonic events and forces.']]},
{id:'yellowstone',module:2,title:'Yellowstone Hotspot Activity',short:'Yellowstone Hotspot',type:'Map & calculation',points:'22 points',summary:'Calculate plate speed, interpret plate direction, compare volcanism, and document current Yellowstone status.',product:'An answer sheet with 11 responses: Q1–4 measurements and speed conversions; Q5–8 direction analysis; Q9–10 volcanic explanations; Q11 a current observatory-status screenshot.',criteria:'Q1–4: 8 points; Q5–8: 8 points; Q9–10: 4 points; Q11: 2 points. Each question is worth 2 points. Detailed quality descriptors were not supplied.',strength:'Students transform map measurements into rates and use an age pattern to interpret motion. Composition-to-eruption explanations provide direct process evidence.',action:'Ask students to compare two distance-measurement approaches and discuss uncertainty. For Q11, add a short interpretation connecting the alert level with monitoring evidence.',note:'Objective 2.2 is an inferred additional connection: students interpret a geologic hotspot map, although the prompt explicitly lists only 1.2 and 2.3. The activity document, map, and answer-sheet attachments were not independently reviewed.',dimensions:[['Objective fit',4,'The task directly addresses Earth processes and geologic map interpretation; measurement evaluation is only partially elicited.'],['Cognitive match',4,'Calculations and interpretations require application and analysis. Comparing measurement methods remains absent.'],['Observable evidence',4,'The answer sheet should expose calculations and explanations; the current-status screenshot alone is limited evidence.'],['Scoring transparency',4,'Question-level point values and categories are explicit; quality descriptors would make judgments more consistent.']],maps:[['1.2',3,'Declared','Students measure distance and calculate a rate using a specified method. They use a method, but do not evaluate alternative measurement methods or uncertainty.','Compare two measurement approaches and explain how uncertainty affects the rate.'],['2.2',4,'Inferred','Q1–8 require interpreting a hotspot map, age labels, scale, and north arrow. This supports the geologic-map component; topographic interpretation is not present.','Confirm the map supports these judgments and assess topographic interpretation elsewhere.'],['2.3',5,'Declared','Q5–10 connect plate movement and volcanic composition to Earth processes and eruption style through required interpretations and explanations.','Retain the causal explanations and add explicit accuracy descriptors to the scoring guide.']]}
];
const labels={1:'Not evidenced',2:'Indirect',3:'Partial',4:'Strong',5:'Very strong'};const state={view:'overview',filter:'all'};
const obj=id=>objectives.find(x=>x[0]===id)?.[1]||id;
const score=(a,id)=>a.maps.find(m=>m[0]===id)?.[1]||1;
const best=(id,as=assignments)=>Math.max(1,...as.map(a=>score(a,id)));
const category=n=>n>=4?'strong':n===3?'partial':n===2?'indirect':'';
const countStrong=as=>objectives.filter(o=>best(o[0],as)>=4).length;
const tag=t=>`<span class="tag">${t}</span>`;
function steps(n){return n===null?'<p class="muted">Not rated · criteria unavailable</p>':`<div class="ratingrow" aria-label="${n} out of 5: ${labels[n]}">${[1,2,3,4,5].map(i=>`<span aria-hidden="true" class="step ${i<=n?'on':''}">${i}</span>`).join('')}<span class="ratinglabel">${n}/5 · ${labels[n]}</span></div>`}
function heading(k,t,p){return `<div class="heading"><div><p class="eyebrow">${k}</p><h1>${t}</h1><p>${p}</p></div><button class="btn" data-print>Print this view</button></div>`}
function outcomeChart(as){return `<div class="outcomes">${outcomes.map((o,i)=>{let os=objectives.filter(x=>x[0].startsWith((i+1)+'.')),n=os.filter(x=>best(x[0],as)>=4).length;return `<button class="outcome" data-outcome="${i+1}" aria-label="Explore outcome ${i+1}, ${o[0]}, ${n} of ${os.length} objectives strongly evidenced"><span class="ocnum">${i+1}</span><span class="outname"><strong>${o[0]}</strong><small>${o[1]}</small></span><span class="segments" aria-hidden="true">${os.map(x=>`<span class="segment ${category(best(x[0],as))}"></span>`).join('')}</span><span class="fraction">${n}/${os.length}</span></button>`}).join('')}</div>`}
function legend(){return '<div class="legend"><span><i class="swatch strong"></i>Strong / very strong</span><span><i class="swatch partial"></i>Partial</span><span><i class="swatch indirect"></i>Indirect</span><span><i class="swatch"></i>Not evidenced</span></div>'}
function cards(as){return `<div class="assignmentlist">${as.map(a=>`<article class="assignmentcard"><div>${tag(a.type)}<h3>${a.title}</h3><p>${a.summary}</p><div class="pillrow">${a.maps.map(m=>`<span class="pill">${m[0]} · ${m[1]}/5${m[2]==='Conditional'?' · conditional':''}</span>`).join('')}</div></div><button class="btn" data-view="assignment-${a.id}">View alignment →</button></article>`).join('')}</div>`}
function overview(){return heading('ESC 1000C · Earth Science','See the learning connections.','Course outcomes → modules → assignment evidence. A working alignment review for the course coordinator.')+`<div class="notice"><strong>Initial evidence sample.</strong> These three assignments represent two modules, not the complete course. Ratings are instructional-design judgments for coordinator validation, not student achievement results.</div><div class="stats"><div class="stat"><strong>3</strong><span>Assignments reviewed</span><small>2 in Module 1 · 1 in Module 2</small></div><div class="stat"><strong>5</strong><span>Major course outcomes</span><small>19 supporting objectives</small></div><div class="stat"><strong>${countStrong(assignments)} <span style="display:inline;font-size:18px;color:var(--muted)">/ 19</span></strong><span>Objectives strongly evidenced</span><small>At least one assignment rated 4 or 5</small></div><div class="stat"><strong>${objectives.filter(o=>best(o[0])===1).length}</strong><span>Objectives not evidenced</span><small>In this sample only · not course gaps</small></div></div><div class="split"><section class="panel"><div class="panelhead"><div><h2>Outcome coverage</h2><p>Each segment is one objective. Counts show strong evidence.</p></div></div>${outcomeChart(assignments)}<div style="margin-top:22px">${legend()}</div><p class="sectionintro" style="margin:16px 0 0">Select an outcome to inspect its assignment connections.</p></section><section class="panel"><p class="eyebrow">Coordinator focus</p><h2>Three useful next steps</h2><div class="callout"><b>01</b><div><strong>Make scientific reasoning required</strong><p>The historical-figures discussion offers connections, but most scientific performances remain optional or dependent on the chosen scientist.</p></div></div><div class="callout"><b>02</b><div><strong>Evaluate the measurement method</strong><p>Yellowstone asks students to use a method. Add comparison and uncertainty to fully address objective 1.2.</p></div></div><div class="callout"><b>03</b><div><strong>Complete the course picture</strong><p>Collect later assignments before making judgments about outcomes 4 and 5.</p></div></div></section></div><section class="panel"><div class="panelhead"><div><h2>Follow a module pathway</h2><p>Open a module, then inspect the evidence behind each rating.</p></div><span class="tag">2 modules supplied</span></div><div class="modulegrid">${[1,2].map(n=>`<button class="modulecard" data-view="module-${n}"><span class="eyebrow">${n===1?'Chronology & scientific contributions':'Plate motion & volcanism'}</span><span class="big">Module ${n} <span style="float:right">↗</span></span><p>${assignments.filter(a=>a.module===n).length} assignment${n===1?'s':''} · ${countStrong(assignments.filter(a=>a.module===n))} objectives strongly evidenced</p><div class="pillrow">${assignments.filter(a=>a.module===n).map(a=>`<span class="pill">${a.short}</span>`).join('')}</div></button>`).join('')}</div></section>`}
function matrix(){let os=objectives.filter(o=>state.filter==='all'||o[0].startsWith(state.filter+'.'));return heading('Course → objectives → assignments','Alignment matrix','Compare all 19 supporting objectives across the three supplied assignments. Select a rating to open its evidence.')+`<section class="panel"><div class="filters"><label for="outcomeFilter">Show outcome</label><select id="outcomeFilter"><option value="all">All five outcomes</option>${outcomes.map((o,i)=>`<option value="${i+1}" ${state.filter==i+1?'selected':''}>${i+1}. ${o[0]}</option>`).join('')}</select></div><div class="legend" style="margin-bottom:16px">${[1,2,3,4,5].map(n=>`<span><b class="cell r${n}">${n}</b>${labels[n]}</span>`).join('')}<span>C = conditional on scientist choice</span></div><div class="tablewrap"><table class="heat"><caption style="text-align:left;padding-bottom:12px;font-size:14px">Assignment-to-objective alignment · ratings describe task design</caption><thead><tr><th scope="col">Approved objective · short label</th>${assignments.map(a=>`<th scope="col">${a.short}<br>Module ${a.module}</th>`).join('')}</tr></thead><tbody>${os.map((o,i)=>`${i===0||o[0][0]!==os[i-1][0][0]?`<tr class="group"><td colspan="4">OUTCOME ${o[0][0]} · ${outcomes[Number(o[0][0])-1][0]}</td></tr>`:''}<tr><td><span class="objcode">${o[0]}</span>${o[1]}</td>${assignments.map(a=>{let n=score(a,o[0]),c=a.maps.find(m=>m[0]===o[0])?.[2]==='Conditional';return `<td><button class="cell r${n}" data-view="assignment-${a.id}" data-focus="${o[0]}" aria-label="${a.short}, objective ${o[0]}, ${n} out of 5 ${labels[n]}${c?', conditional':''}">${n}${c?' C':''}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="sectionintro" style="margin:16px 0 0">A 1 means the supplied assignment does not elicit that objective. It is not a failing grade. Conditional ratings are not counted as strong coverage.</p></section>`}
function moduleView(n){let as=assignments.filter(a=>a.module===n);return heading(`Course overview / Module ${n}`,`Module ${n}`,n===1?'Geologic chronology and contributions to the geosciences.':'Plate motion, volcanic processes, and evidence from a hotspot track.')+`<div class="notice">Module labels are organizational. No separate module learning objectives were supplied; connections below use the approved course objectives.</div><section class="panel"><div class="panelhead"><div><h2>Module contribution</h2><p>${as.length} assignment${as.length>1?'s':''} · ${countStrong(as)} of 19 course objectives strongly evidenced in this module sample.</p></div></div>${outcomeChart(as)}<div style="margin-top:20px">${legend()}</div></section><h2 style="margin:28px 0 16px">Assignment evidence</h2>${cards(as)}`}
function assignmentView(id){let a=assignments.find(a=>a.id===id);return `<div class="breadcrumbs"><button data-view="overview">Course</button> / <button data-view="module-${a.module}">Module ${a.module}</button> / Assignment</div>`+heading(`Module ${a.module} · ${a.type} · ${a.points}`,a.title,a.summary)+`<div class="notice"><strong>Review note.</strong> ${a.note}</div><section class="panel"><div class="panelhead"><div><h2>Objective connections</h2><p>Five-point, Likert-style alignment ratings with evidence and a next step.</p></div><button class="btn" data-view="method">How ratings work</button></div>${a.maps.map(m=>`<article class="mapping" id="objective-${m[0]}" tabindex="-1"><div class="mappinghead"><h3><span class="objcode">${m[0]}</span>${obj(m[0])}</h3>${tag(m[2])}</div>${steps(m[1])}<p><strong>Evidence:</strong> ${m[3]}</p><p><strong>To strengthen:</strong> ${m[4]}</p></article>`).join('')}<div id="unmapped"></div></section><section class="panel"><h2>Assignment design breakdown</h2><p class="sectionintro">Separate judgments on four dimensions; scores are not averaged into a course grade. “Not rated” indicates missing review material.</p><div class="evidence">${a.dimensions.map(d=>`<div><h3>${d[0]}</h3>${steps(d[1])}<p>${d[2]}</p></div>`).join('')}</div></section><div class="split"><section class="panel"><h2>What students produce</h2><p>${a.product}</p><h3>Available scoring information</h3><p>${a.criteria}</p></section><section class="panel"><p class="eyebrow">Instructional design recommendation</p><h2>Keep the strength. Close the gap.</h2><p><strong>Keep:</strong> ${a.strength}</p><p><strong>Refine:</strong> ${a.action}</p></section></div>`}
function method(){return heading('Review framework','A transparent rating scale.','Use these judgments to guide a coordinator conversation. They describe alignment in the supplied task instructions, not measured learning or institutional approval.')+`<section class="panel"><h2>Five-point alignment scale</h2><p class="sectionintro">An ordinal, Likert-style expert rubric—not a validated survey instrument. Higher ratings indicate a closer match between the objective and the required student performance.</p><div class="scalegrid">${[[1,'Not evidenced','No required task elicits the objective.'],[2,'Indirect','Topic connection exists; performance is optional, conditional, or too weak.'],[3,'Partial','Some required performance aligns, but a substantial part is missing.'],[4,'Strong','Direct evidence addresses most of the objective; a limited gap remains.'],[5,'Very strong','Required performance directly matches the objective and makes the intended evidence observable.']].map(x=>`<div class="scaleitem"><span class="cell r${x[0]}">${x[0]}</span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div><details open><summary>How overview counts are calculated</summary><p style="margin-top:12px">For each objective, the overview uses the highest assignment rating in the selected sample. Ratings of 4–5 count as strongly evidenced; 3 is partial; 2 is indirect; 1 is not evidenced. Each objective is counted once, even when multiple assignments connect to it. Segment counts vary because outcomes contain different numbers of objectives.</p><p>The current sample contains 4 strongly evidenced objectives, 1 partial, 3 indirect, and 11 not evidenced. These 19 statuses describe the reviewed sample, not the completeness or effectiveness of the entire course. No averages or mastery percentages are calculated.</p></details><details open><summary>How the assignment breakdown is judged</summary><ul><li><strong>Objective fit:</strong> how directly required work addresses the stated objectives.</li><li><strong>Cognitive match:</strong> whether students perform the intended level of thinking, such as evaluating rather than describing.</li><li><strong>Observable evidence:</strong> whether the deliverable makes that performance visible.</li><li><strong>Scoring transparency:</strong> whether available criteria and point allocations support consistent judgment.</li></ul><p>A 1 indicates absent evidence for a dimension; 2 indirect or weak support; 3 partial support; 4 strong support with a limited gap; 5 complete, explicit support. Missing external grading material is marked “Not rated,” not scored 1.</p></details><details open><summary>Declared, inferred, and conditional connections</summary><p style="margin-top:12px"><strong>Declared:</strong> the assignment explicitly names the objective. <strong>Inferred:</strong> the reviewer identifies a connection in required work. <strong>Conditional:</strong> the connection depends on the scientist selected. Listing an objective does not automatically make the assignment aligned.</p></details></section><section class="panel"><h2>Sources & review boundaries</h2><ul><li><a href="${source}" target="_blank" rel="noopener">SPC approved course outline: ESC 1000C — Earth Science ↗</a>. Effective Fall 2024; 3 credits and 77 contact hours. Dashboard labels paraphrase the outline; objective IDs preserve its hierarchy.</li><li>Geologic Time Scale Concept Sketch: assignment text supplied by the course designer.</li><li>Historical Figures in the Geosciences: Focus on Minorities and Women: supplied discussion instructions.</li><li>Yellowstone Hotspot Activity: supplied assignment instructions. Module 2 placement confirmed by the course designer.</li></ul><p>The referenced Canvas activity files, answer sheet, Discussion Guidelines, student submissions, and complete course assessment inventory were not reviewed. All alignment ratings and suggested revisions are provisional instructional-design judgments for coordinator validation.</p><p>The outline’s 70% mastery requirement concerns student performance. It is separate from these 1–5 design ratings.</p><p>Prepared September 21, 2026 · Initial review, three assignments.</p></section>`}
function later(){return heading('Course pathways','Additional modules','Extend the review as more course assignments become available.')+`<section class="panel"><div class="empty"><h2>Course evidence still to come</h2><p>Only Modules 1 and 2 have been supplied. The total number of modules, their titles, and later assignments are not yet known.</p><p>For each additional module, collect its assignment instructions, associated course objectives, required student products, and scoring criteria. Add those mappings before drawing course-wide conclusions.</p><button class="btn primary" data-view="matrix">Review objectives awaiting evidence</button></div></section>`}
function render(focus){let v=state.view;document.querySelectorAll('[data-view].navbtn').forEach(b=>{let selected=b.dataset.view===v||(v.startsWith('assignment-')&&b.dataset.view==='module-'+assignments.find(a=>'assignment-'+a.id===v)?.module);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('main').innerHTML=(v==='overview'?overview():v==='matrix'?matrix():v==='method'?method():v==='later'?later():v.startsWith('module-')?moduleView(Number(v.split('-')[1])):assignmentView(v.slice(11)))+`<footer class="footer"><span>SPC IDEAS · ESC 1000C alignment review · Initial sample</span><a href="${source}" target="_blank" rel="noopener">Approved course outline ↗</a></footer>`;if(focus){let a=assignments.find(a=>'assignment-'+a.id===v);if(a&&!a.maps.some(m=>m[0]===focus)){document.querySelector('#unmapped').innerHTML=`<article class="mapping" id="objective-${focus}" tabindex="-1"><h3>${focus} · ${obj(focus)}</h3>${steps(1)}<p>No required performance in this supplied assignment directly elicits this objective. This is not a negative judgment of the assignment’s other purposes.</p></article>`}document.getElementById('objective-'+focus)?.scrollIntoView({block:'center'});document.getElementById('objective-'+focus)?.focus({preventScroll:true})}}
function go(v,focus){state.view=v;history.replaceState(null,'','#'+v);render(focus);if(!focus){window.scrollTo(0,0);document.querySelector('main').focus({preventScroll:true})}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-outcome],[data-print]');if(!b)return;if(b.hasAttribute('data-print'))window.print();else if(b.dataset.outcome){state.filter=b.dataset.outcome;go('matrix')}else go(b.dataset.view,b.dataset.focus)});document.addEventListener('change',e=>{if(e.target.id==='outcomeFilter'){state.filter=e.target.value;render();document.querySelector('#outcomeFilter').focus()}});let initial=location.hash.slice(1);if(['overview','matrix','method','later','module-1','module-2',...assignments.map(a=>'assignment-'+a.id)].includes(initial))state.view=initial;render();
</script></body></html>
