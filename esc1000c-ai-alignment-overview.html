<body><a class="skip" href="#main">Skip to dashboard</a>
<header class="topbar"><div class="brand"><div class="brandmark">SPC</div><div><strong>IDEAS · Instructional Design</strong><span class="subbrand">Course review · Earth Science</span></div></div><a href="https://anthonyids.github.io/IDEAS_Repository/">Resource library ↗</a></header>
<div class="shell"><aside class="sidebar"><div class="sideinner"><div class="course"><p class="eyebrow">Course review</p><b>ESC1000C</b><p>Earth Science</p></div><nav aria-label="Dashboard navigation"><a class="navlink" href="#overview"><span class="navicon" aria-hidden="true">◫</span>The big picture</a><a class="navlink" href="#matrix"><span class="navicon" aria-hidden="true">▦</span>Alignment grid</a><a class="navlink" href="#outcomes"><span class="navicon" aria-hidden="true">◎</span>Learning outcomes</a><a class="navlink" href="#assignments"><span class="navicon" aria-hidden="true">▤</span>Assessments</a><a class="navlink" href="#help"><span class="navicon" aria-hidden="true">?</span>How to read this page</a></nav><div class="sidefoot"><p><strong>Faculty review draft</strong></p><p>18 assessments<br>6 course modules</p><button class="btn" data-theme-button>Use dark mode</button><button class="btn" data-print>Print full review</button></div></div></aside><main class="content" id="main" tabindex="-1"></main></div>
<dialog id="details-dialog" aria-labelledby="dialog-title"><div class="dialoghead"><h2 id="dialog-title">Rating evidence</h2><button class="btn" id="close-dialog" aria-label="Close rating evidence">Close ✕</button></div><div class="dialogbody" id="dialog-body"></div></dialog>
<section class="print-report" id="print-report" aria-label="Complete printable course review"></section>
<noscript><div class="error">This dashboard needs JavaScript to display the assessment review. Enable JavaScript, or ask the course coordinator for a printed review.</div></noscript>
<script>
'use strict';
let DATA;
try { DATA=JSON.parse(document.getElementById('course-data').textContent); } catch(error) { document.getElementById('main').innerHTML='<div class="error"><h1>Course data could not be read</h1><p>Check the JSON block for missing quotation marks or extra commas, then reload.</p></div>'; throw error; }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const introHtml=()=>esc(DATA.introduction).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const label=n=>DATA.alignmentScale.find(s=>s.value===n)?.label||'Not yet reviewed';
const main=document.getElementById('main'),dialog=document.getElementById('details-dialog');
const objectives=DATA.outcomes.filter(o=>o.kind==='objective'),parents=DATA.outcomes.filter(o=>o.kind==='outcome');
const assignment=id=>DATA.assignments.find(a=>a.id===id),outcome=id=>DATA.outcomes.find(o=>o.id===id);
const rated=a=>Object.entries(a.ratings).filter(([,r])=>r.score!==null);
const supporting=id=>DATA.assignments.filter(a=>a.ratings[id]?.score>=2);
const best=id=>Math.max(0,...DATA.assignments.map(a=>a.ratings[id]?.score||0));
const strong=objectives.filter(o=>best(o.id)>=4),attention=objectives.filter(o=>best(o.id)<4);
const weak=attention.filter(o=>best(o.id)>0),unknown=attention.filter(o=>best(o.id)===0);
const vulnerable=DATA.assignments.filter(a=>a.ai.armsLevel>=4);
const notice='<div class="notice"><strong>Suggested ratings, not final decisions.</strong> Faculty review is needed. Missing evidence is marked “Not yet reviewed.” AI resilience depends on how the assessment is delivered.</div>';
let moduleFilter='all',searchText='',outcomeFilter='all',statusFilter='all',lastFocus=null;
function badge(a){return `<div class="policyline"><span class="badge policy">AI permission · AIAS ${a.ai.aiasLevel===null?'not set':esc(a.ai.aiasLevel)}</span><p class="reviewline">${esc(a.ai.permission)}</p></div>`;}
function rating(r,attrs=''){return `<${attrs?'button':'span'} class="rating r${r.score||0}" ${attrs}>${r.score===null?'Not yet reviewed':`<b>${r.score}</b><span>${esc(label(r.score))}</span>`}</${attrs?'button':'span'}>`;}
function ring(a){let n=a.ai.armsLevel,l=DATA.arms.levels.find(x=>x.level===n);return `<div class="ringrow"><div class="ring risk${n||0}" style="--fill:${n?(6-n)*20:0}" role="img" aria-label="${esc(l?`${l.resilience}. Provisional ARMS risk level ${n}, ${l.risk}. Ring fill is an ordinal display, not a probability.`:'AI resilience not yet reviewed')}"><div class="ringinside"><strong>${esc(l?.resilience||'Not yet reviewed')}</strong><span>${n?`ARMS ${n} / 5`:'No rating'}</span></div></div><div class="ringcopy"><p><strong>${n?`${esc(l.risk)} AI risk`:'AI risk not reviewed'}</strong></p><p>Provisional estimate</p><p class="muted">Fuller ring = more resilient</p></div></div>`;}
function title(k,t,p){return `<header class="heading"><div><p class="eyebrow">${esc(k)}</p><h1>${esc(t)}</h1><p>${p}</p></div><a class="btn" href="#help">How to read this page</a></header>`;}
function moduleSelect(){return `<label>Module<select id="module-filter"><option value="all">All six modules</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${moduleFilter==n?'selected':''}>Module ${n}</option>`).join('')}</select></label>`;}
function currentAssignments(){return DATA.assignments.filter(a=>(moduleFilter==='all'||a.module==moduleFilter)&&(!searchText||`${a.title} ${a.summary}`.toLowerCase().includes(searchText.toLowerCase())));}
function overview(){return title('18 assessments · 6 modules',DATA.title,introHtml())+notice+`<h2>The big picture</h2><div class="stats"><a class="stat" href="#assignments"><strong>${DATA.assignments.length}</strong><b>Assessments included</b><p>Only the descriptions supplied in this chat.</p></a><a class="stat" href="#outcomes"><strong>${strong.length}<span> / 19</span></strong><b>Objectives strongly supported</b><p>At least one suggested rating of 4 or 5.</p></a><a class="stat" href="#attention"><strong>${attention.length}</strong><b>Objectives need attention</b><p>${weak.length} have weaker links; ${unknown.length} have no reviewed evidence.</p></a><a class="stat" href="#vulnerable"><strong>${vulnerable.length}<span> / 18</span></strong><b>Assessments vulnerable to AI</b><p>Provisional high or very high risk estimates.</p></a></div><div class="split"><section class="panel"><div class="panelhead"><div><h2>Where learning is supported</h2><p>Each bar segment is one supporting objective. Select an outcome to see its exact wording and evidence.</p></div></div>${parents.map(o=>{let children=objectives.filter(c=>c.parent===o.id),n=children.filter(c=>best(c.id)>=4).length;return `<button class="coverage" data-outcome="${o.id}"><span class="circle">${o.id}</span><span><span class="covername">${esc(o.text)}</span><span class="segments" aria-hidden="true">${children.map(c=>`<span class="${best(c.id)>=4?'strong':''}"></span>`).join('')}</span></span><span class="covercount" aria-label="${n} of ${children.length} supporting objectives strongly supported">${n}/${children.length}</span></button>`}).join('')}<p class="small muted" style="margin:20px 0 0">Counts describe assessment design, not student mastery. An unfilled segment is not proof of a course gap.</p></section><section class="panel"><p class="eyebrow">Faculty decisions</p><h2>Three places to start</h2><div class="focusitem"><h3>1. Make the required thinking visible</h3><p>Some tasks ask students to describe a topic while the objective asks them to evaluate methods, compare evidence, or explain a system.</p><a href="#matrix">Explore the reasons behind ratings →</a></div><div class="focusitem"><h3>2. Check the work behind the product</h3><p>Observation records and investigation plans offer useful evidence. Add a short explanation or check-in to confirm how students reached their conclusions.</p><a href="#vulnerable">See a practical improvement for each task →</a></div><div class="focusitem"><h3>3. Decide what AI use is allowed</h3><p>No instructor policy was supplied. Every AI permission badge is unassigned; a risk estimate does not grant or prohibit AI use.</p><a href="#help">Understand risk versus permission →</a></div></section></div><section class="panel"><div class="panelhead"><div><h2>Explore a module</h2><p>Open its assessments and review their evidence.</p></div></div><div class="modulegrid">${[1,2,3,4,5,6].map(n=>`<a class="modulecard" href="#module-${n}"><b>Module ${n} ↗</b><p>${DATA.assignments.filter(a=>a.module===n).length} assessments</p></a>`).join('')}</div></section><div class="notice"><strong>Framework verification in progress.</strong> Official ARMS level descriptions are awaiting confirmation. The rings are clearly marked provisional; no unverified definition is presented as official.</div>`;}
function matrix(){let as=DATA.assignments.filter(a=>moduleFilter==='all'||a.module==moduleFilter),os=DATA.outcomes.filter(o=>outcomeFilter==='all'||o.id===outcomeFilter||o.parent===outcomeFilter);return title('Compare assessments','Alignment grid','Outcomes and objectives run down the side; assessments run across the top. Select any cell to read its reason and evidence.')+notice+`<div class="filters">${moduleSelect()}<label>Outcome<select id="outcome-filter"><option value="all">All five outcomes</option>${parents.map(o=>`<option value="${o.id}" ${outcomeFilter===o.id?'selected':''}>Outcome ${o.id}</option>`).join('')}</select></label></div><div class="legend" aria-label="Alignment rating legend">${DATA.alignmentScale.map(s=>rating({score:s.value})).join('')}${rating({score:null})}</div><p class="muted small">Scroll sideways to compare more assessments. Use the module filter to narrow the grid. All numeric ratings are suggestions needing human review.</p><div class="tablewrap" tabindex="0" role="region" aria-label="Scrollable alignment grid"><table class="matrix"><caption class="small" style="text-align:left;padding:14px">${as.length} assessments · ${os.length} outcome/objective rows · exact official wording</caption><thead><tr><th scope="col">Official outcomes and objectives</th>${as.map(a=>`<th scope="col"><button class="colbtn" data-assignment="${a.id}">${esc(a.title)}<span>Module ${a.module}</span></button></th>`).join('')}</tr></thead><tbody>${os.map(o=>`<tr class="${o.kind==='outcome'?'parent':''}"><th scope="row"><button class="outbtn" data-outcome="${o.id}"><b>${o.kind==='outcome'?'Outcome':'Objective'} ${o.id}</b>${esc(o.label)} ${esc(o.text)}</button></th>${as.map(a=>`<td>${rating(a.ratings[o.id],`data-cell="${a.id}|${o.id}" aria-label="${esc(a.title)}, ${o.kind} ${o.id}: ${a.ratings[o.id].score??'Not yet reviewed'}${a.ratings[o.id].score?', '+esc(label(a.ratings[o.id].score)):''}. Open evidence."`)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:18px">The report numbers objectives within each outcome. IDs such as 2.3 are navigation aids. The original wording, labels, and order are preserved.</p>`;}
function outcomesView(onlyAttention=false){return title('Official course outline',onlyAttention?'Objectives needing attention':'Learning outcomes','The five major outcomes and 19 supporting objectives appear in the official order and wording. Select one to inspect its assessment connections.')+notice+parents.map(o=>{let children=objectives.filter(c=>c.parent===o.id&&(!onlyAttention||best(c.id)<4));if(onlyAttention&&!children.length)return '';return `<section class="outgroup" style="margin-bottom:20px"><h2><button class="textbutton" data-outcome="${o.id}">${o.label} ${esc(o.text)}</button></h2><p class="small muted">${objectives.filter(c=>c.parent===o.id&&best(c.id)>=4).length} of ${objectives.filter(c=>c.parent===o.id).length} supporting objectives have a suggested rating of 4 or 5.</p>${children.map(c=>`<div class="objectiverow"><div><button class="textbutton" data-outcome="${c.id}">${c.label} ${esc(c.text)}</button><p>Objective ${c.id} · ${supporting(c.id).length} suggested supporting ${supporting(c.id).length===1?'assessment':'assessments'}</p></div><span class="badge ${best(c.id)<4?'review':''}">${best(c.id)>=4?'Strong support':best(c.id)===0?'Needs attention · not yet reviewed':'Needs attention · weaker links'}</span></div>`).join('')}</section>`}).join('')+`<p class="small muted">*Major Learning Outcome is set by and in compliance with DOE State Rule 6A-14.0303.</p>`;}
function card(a){return `<article class="assessment"><span class="badge">Module ${a.module} · ${esc(a.type)}</span><h3>${esc(a.title)}</h3><p class="summary">${esc(a.summary)}</p>${ring(a)}<p class="small"><strong>Why:</strong> ${esc(a.ai.why)}</p><p class="recommendation"><strong>Try this:</strong> ${esc(a.ai.suggestion)}</p>${badge(a)}<a class="btn primary" href="#assignment-${a.id}">View ratings and evidence →</a></article>`;}
function assignmentsView(vulnerableOnly=false){let as=currentAssignments().filter(a=>!vulnerableOnly||a.ai.armsLevel>=4);return title('Assessment review',vulnerableOnly?'Assessments vulnerable to AI':'Explore the assessments','The ring shows how easily AI could do the work; the AI Assessment Scale (AIAS) badge shows how much AI the instructor allows.')+notice+`<div class="filters">${moduleSelect()}<label>Find an assessment<input id="assignment-search" type="search" placeholder="Search title or description" value="${esc(searchText)}"></label></div><p id="result-count" role="status" class="muted">${as.length} assessments shown. All AI risk estimates are provisional; official ARMS descriptions are awaiting verification.</p><div class="assignments" id="assignment-results">${as.length?as.map(card).join(''):'<p class="empty">No assessments match. Clear the search or choose another module.</p>'}</div>`;}
function reason(a,o,r){return `<article class="reasonrow"><h3>${o.kind==='outcome'?'Outcome':'Objective'} ${o.id}: ${esc(o.text)}</h3>${rating(r)}<p>${esc(r.reason)}</p>${r.evidence?`<blockquote><strong>Assignment evidence:</strong> ${esc(r.evidence)}</blockquote>`:''}<p class="reviewline">${esc(r.status)}</p></article>`;}
function assignmentView(id){let a=assignment(id);if(!a)return missing();return `<a class="back" href="#assignments">← All assessments</a>`+title(`Module ${a.module} · ${a.type}`,a.title,esc(a.summary))+notice+`<div class="split"><section class="panel"><h2>AI resilience and permission</h2>${ring(a)}<p><strong>Why:</strong> ${esc(a.ai.why)}</p><p class="recommendation"><strong>Try this:</strong> ${esc(a.ai.suggestion)}</p>${badge(a)}<p class="reviewline">${esc(a.ai.status)} Delivery conditions can change this estimate.</p><p class="small muted">Official ARMS descriptions are pending verification. Ring fill represents an ordered level, not a probability or percentage of work AI can complete.</p></section><section class="panel"><h2>What the description requires</h2><ul>${a.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p class="small"><strong>Source:</strong> ${esc(a.source)}</p><p class="small muted">${esc(a.limitations)}</p></section></div><section class="panel"><h2>Reviewed connections</h2><p class="muted">Every rating below is an AI-generated suggestion for faculty review. A topical connection is not automatically a complete match.</p>${DATA.outcomes.filter(o=>a.ratings[o.id].score!==null).map(o=>reason(a,o,a.ratings[o.id])).join('')}<details><summary>Not yet reviewed (${DATA.outcomes.filter(o=>a.ratings[o.id].score===null).length} connections)</summary><p>No rating has been inferred for the connections below.</p>${DATA.outcomes.filter(o=>a.ratings[o.id].score===null).map(o=>`<p><button class="textbutton" data-cell="${a.id}|${o.id}">${o.id} · ${esc(o.text)}</button></p>`).join('')}</details></section>`;}
function outcomeView(id){let o=outcome(id);if(!o)return missing();let supporters=DATA.assignments.filter(a=>a.ratings[id].score>=2),others=DATA.assignments.filter(a=>a.ratings[id].score===1),pending=DATA.assignments.filter(a=>a.ratings[id].score===null);return `<a class="back" href="#outcomes">← All learning outcomes</a>`+title(`${o.kind==='outcome'?'Outcome':'Objective'} ${o.id}`,o.text,'Inspect the required student work before confirming a rating.')+notice+`<section class="panel"><h2>${best(id)>=4?'At least one strong connection':'Needs attention'}</h2><p>${best(id)>=4?'One or more assessments have a suggested rating of 4 or 5.':best(id)>0?'Reviewed connections are partial or indirect. No assessment has a suggested rating of 4 or 5.':'No connections have been reviewed from the supplied evidence. This is not a confirmed absence from the course.'}</p><p class="muted">${supporters.length} suggested supporting assessments · ${others.length} reviewed as not aligned · ${pending.length} not yet reviewed</p>${o.kind==='outcome'?`<h3>Supporting objectives</h3><ul>${objectives.filter(c=>c.parent===id).map(c=>`<li><button class="textbutton" data-outcome="${c.id}">${c.label} ${esc(c.text)}</button></li>`).join('')}</ul>`:''}</section><section class="panel"><h2>Assessment evidence</h2>${[...supporters,...others].map(a=>`<article class="reasonrow"><h3><a href="#assignment-${a.id}">${esc(a.title)}</a> · Module ${a.module}</h3>${rating(a.ratings[id],`data-cell="${a.id}|${id}" aria-label="Open evidence for ${esc(a.title)} and ${o.kind} ${id}"`)}<p>${esc(a.ratings[id].reason)}</p><blockquote><strong>Evidence:</strong> ${esc(a.ratings[id].evidence)}</blockquote><p class="reviewline">${esc(a.ratings[id].status)}</p></article>`).join('')||'<p class="empty">No reviewed supporting evidence yet. Ask faculty for a task or rubric that requires students to demonstrate this objective.</p>'}<details><summary>Assessments not yet reviewed for this goal (${pending.length})</summary><ul>${pending.map(a=>`<li><a href="#assignment-${a.id}">${esc(a.title)}</a></li>`).join('')}</ul></details></section>`;}
function help(){return title('A guide for faculty','How to read this page','Use the ratings to start a conversation about required student work. They are suggestions, not final decisions or measures of student achievement.')+`<section class="panel"><h2>Three different questions</h2><div class="helpgrid"><div><h3>Does the assignment match the goal?</h3><p>The 1–5 alignment rating describes how well required student work addresses an official learning outcome or objective. Select a rating to see the reason and evidence.</p></div><div><h3>Could AI do the work?</h3><p>The resilience ring estimates how easily AI could produce the requested work. The estimate depends on delivery, available tools, and required evidence of the student’s thinking.</p></div><div><h3>Is AI use allowed?</h3><p>The AI Assessment Scale (AIAS) badge records instructor permission. No policy was supplied, so every badge remains unassigned. A blank policy is not permission and is not a ban.</p></div><div><h3>What does “Not yet reviewed” mean?</h3><p>No supported rating has been recorded for that pair. It is excluded from numeric ratings. It is never converted into a 1 or a zero.</p></div></div></section><section class="panel"><h2>Alignment scale</h2>${DATA.alignmentScale.map(s=>`<p>${rating({score:s.value})} ${esc(s.description)}</p>`).join('')}<p class="small muted">All AI-generated ratings carry “Suggested rating: needs human review.” The dashboard does not infer a rating simply because an assignment names an objective.</p></section><section class="panel"><h2>AI resilience: fuller means stronger</h2><p>The <strong>AI Risk Measure Scale (ARMS)</strong> is credited to ${esc(DATA.arms.authors)}. The authors describe five categories, from very low to very high risk.</p><div class="notice">${esc(DATA.arms.descriptionStatus)}</div><div class="tablewrap" style="max-height:none"><table class="matrix"><thead><tr><th scope="col">ARMS risk level</th><th scope="col">Dashboard label</th><th scope="col">Ring fill</th><th scope="col">Official description</th></tr></thead><tbody>${DATA.arms.levels.map(l=>`<tr><th scope="row">${l.level} · ${esc(l.risk)}</th><td>${esc(l.resilience)}</td><td>${(6-l.level)*20}% of ring</td><td>${esc(l.officialDescription||'Not yet verified')}</td></tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:16px">The ring reverses the risk order for readability. Its fill is an ordinal display only—not a measured probability, a calibrated score, or the percentage of an assessment AI can complete. Plain-language resilience labels are dashboard adaptations, not official ARMS descriptions.</p><p>Estimates consider personal observations, local context, data selection, process records, live explanation, and whether AI can produce the requested answer from the prompt and supplied materials. No supervised delivery is assumed unless stated.</p></section><section class="panel"><h2>AI permission: the original published scale</h2><p>${esc(DATA.aias.version)}, by ${esc(DATA.aias.authors)}. The names below follow that version; later versions use different wording.</p><ol>${DATA.aias.levels.map(l=>`<li><strong>${esc(l.label)}</strong></li>`).join('')}</ol><p>All 18 assessments are marked <strong>Not yet reviewed — instructor policy needed</strong>. The dashboard does not choose a policy for the instructor.</p></section><section class="panel"><h2>What the summary counts mean</h2><ul><li><strong>Strongly supported:</strong> a supporting objective has at least one suggested alignment rating of 4 or 5.</li><li><strong>Needs attention:</strong> a supporting objective has no rating of 4 or 5. The page separates weaker reviewed links from objectives with no reviewed evidence.</li><li><strong>Vulnerable to AI:</strong> an assessment has a provisional ARMS risk level of 4 or 5.</li><li><strong>Scope:</strong> summary counts use all 18 supplied assessments and all 19 supporting objectives. The five major outcomes are shown separately and are not double-counted.</li></ul><p>No point weighting or average is calculated. There is no evidence here of student mastery, and missing assignments or rubrics could change the conclusions.</p></section><section class="panel"><h2>Sources and limits</h2><p>${esc(DATA.scope)}</p><p>Descriptions were supplied by the course designer. Linked Canvas worksheets, detailed rubrics, student submissions, and unstated delivery arrangements were not reviewed. Student-selected topics create conditional links, not guaranteed coverage.</p><p>The course outline’s five major outcomes and 19 supporting objectives retain their exact wording and original order. IDs such as 2.3 identify the hierarchy without changing the numbered labels.</p><p>*Major Learning Outcome is set by and in compliance with DOE State Rule 6A-14.0303.</p><ul class="sources">${DATA.sources.map(s=>`<li><a href="${esc(s.url)}">${esc(s.title)}</a><p>${esc(s.note)}</p></li>`).join('')}</ul><details><summary>Updating this review</summary><p>The HTML file contains one clearly labeled JSON data block near the top. Update an assignment’s rating, explanation, or evidence there; use null for an unreviewed score. Keep the official outcome text unchanged. The comment above the block explains the fields.</p><p>Edits to the saved file update the dashboard on reload. The browser does not save changes or send assessment data to another service.</p><button class="btn" data-download>Download review data</button></details></section>`;}
function missing(){return title('Page not found','Choose a dashboard view','Use the navigation to return to the assessment review.')+'<a class="btn" href="#overview">The big picture</a>';}
function showCell(aid,oid,trigger){let a=assignment(aid),o=outcome(oid);if(!a||!o)return;lastFocus=trigger;document.getElementById('dialog-title').textContent=`${o.kind==='outcome'?'Outcome':'Objective'} ${oid} · ${a.title}`;document.getElementById('dialog-body').innerHTML=reason(a,o,a.ratings[oid])+`<p class="small muted">${esc(a.limitations)}</p><a class="btn" href="#assignment-${a.id}" data-close-link>View full assessment</a>`;dialog.showModal();document.getElementById('close-dialog').focus();}
function route(){let route=location.hash.slice(1)||'overview';if(route==='main'){main.focus();return;}if(dialog.open)dialog.close();if(route.startsWith('module-')){let n=route.slice(7);moduleFilter=['1','2','3','4','5','6'].includes(n)?n:'all';searchText='';route='assignments';history.replaceState(null,'','#assignments');}let content=route==='overview'?overview():route==='matrix'?matrix():route==='outcomes'?outcomesView():route==='attention'?outcomesView(true):route==='assignments'?assignmentsView():route==='vulnerable'?assignmentsView(true):route==='help'?help():route.startsWith('assignment-')?assignmentView(route.slice(11)):route.startsWith('outcome-')?outcomeView(route.slice(8)):missing();main.innerHTML=content+`<footer class="footer"><span>SPC IDEAS · Faculty review draft · ${esc(DATA.reviewDate)}</span><span><button class="textbutton" data-theme-button>${document.documentElement.dataset.theme==='dark'?'Use light mode':'Use dark mode'}</button> · <button class="textbutton" data-print>Print full review</button></span></footer>`;let active=route==='attention'||route.startsWith('outcome-')?'outcomes':route==='vulnerable'||route.startsWith('assignment-')?'assignments':route;document.querySelectorAll('.navlink').forEach(a=>{if(a.hash==='#'+active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=DATA.title;window.scrollTo(0,0);main.focus({preventScroll:true});}
function buildPrint(){document.getElementById('print-report').innerHTML=`<h1>${esc(DATA.title)}</h1><p>${introHtml()}</p><p>Faculty review draft · ${esc(DATA.reviewDate)}</p><p>${esc(DATA.scope)}</p><p><strong>All ratings are suggestions needing human review. AI risk estimates are provisional; official ARMS descriptions remain unverified. No instructor AI policy was supplied.</strong></p><p>${strong.length}/19 supporting objectives have a rating of 4 or 5; ${weak.length} have weaker links; ${unknown.length} have no reviewed evidence. ${vulnerable.length}/18 assessments have provisional high or very high AI risk.</p><h2>Official outcomes and objectives</h2>${parents.map(o=>`<h3>${o.label} ${esc(o.text)}</h3><ol>${objectives.filter(c=>c.parent===o.id).map(c=>`<li>${esc(c.text)}</li>`).join('')}</ol>`).join('')}<p>*Major Learning Outcome is set by and in compliance with DOE State Rule 6A-14.0303.</p><h2>Rating scale</h2><ul>${DATA.alignmentScale.map(s=>`<li>${s.value}: ${esc(s.label)} — ${esc(s.description)}</li>`).join('')}</ul><p>Not yet reviewed means no supported rating has been recorded. It is not a rating of 1. A fuller resilience ring means lower estimated risk, not a probability. AIAS records permission, not risk.</p>${DATA.assignments.map(a=>{let l=DATA.arms.levels.find(l=>l.level===a.ai.armsLevel);return `<article class="print-assessment"><h2>Module ${a.module}: ${esc(a.title)}</h2><p>${esc(a.summary)}</p><h3>Required work</h3><ul>${a.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><h3>AI resilience: ${esc(l?.resilience||'Not yet reviewed')}</h3><p>Provisional ARMS level ${a.ai.armsLevel??'not set'} · ${esc(l?.risk||'Not yet reviewed')} risk. ${esc(a.ai.why)}</p><p><strong>Try this:</strong> ${esc(a.ai.suggestion)}</p><p><strong>AIAS permission:</strong> ${esc(a.ai.permission)}</p><h3>Suggested alignment ratings — needs human review</h3>${DATA.outcomes.filter(o=>a.ratings[o.id].score!==null).map(o=>{let r=a.ratings[o.id];return `<div class="print-rating"><strong>${o.id}: ${esc(o.text)}</strong><p>${r.score}/5 · ${esc(label(r.score))}</p><p>${esc(r.reason)}</p><p><strong>Evidence:</strong> ${esc(r.evidence)}</p></div>`}).join('')}<p><strong>Not yet reviewed:</strong> ${DATA.outcomes.filter(o=>a.ratings[o.id].score===null).map(o=>o.id).join(', ')}. See the official wording in the outline above.</p><p>${esc(a.limitations)}</p></article>`}).join('')}<h2>Sources</h2><ul>${DATA.sources.map(s=>`<li>${esc(s.title)}<br><span class="sourceurl">${esc(s.url)}</span><p>${esc(s.note)}</p></li>`).join('')}</ul>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-outcome],[data-assignment],[data-cell],[data-theme-button],[data-print],[data-download],[data-close-link]');if(!b)return;if(b.dataset.outcome)location.hash='outcome-'+b.dataset.outcome;else if(b.dataset.assignment)location.hash='assignment-'+b.dataset.assignment;else if(b.dataset.cell)showCell(...b.dataset.cell.split('|'),b);else if(b.hasAttribute('data-theme-button')){let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelectorAll('[data-theme-button]').forEach(x=>x.textContent=dark?'Use light mode':'Use dark mode');}else if(b.hasAttribute('data-print')){buildPrint();window.print();}else if(b.hasAttribute('data-download')){let blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='esc1000c-review-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}else if(b.hasAttribute('data-close-link'))dialog.close();});
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();lastFocus=null;});
document.addEventListener('change',e=>{if(e.target.id==='module-filter'){moduleFilter=e.target.value;route();document.getElementById('module-filter')?.focus();}if(e.target.id==='outcome-filter'){outcomeFilter=e.target.value;route();document.getElementById('outcome-filter')?.focus();}});
document.addEventListener('input',e=>{if(e.target.id==='assignment-search'){searchText=e.target.value;let as=currentAssignments().filter(a=>location.hash!=='#vulnerable'||a.ai.armsLevel>=4);document.getElementById('assignment-results').innerHTML=as.map(card).join('')||'<p class="empty">No assessments match. Clear the search or choose another module.</p>';document.getElementById('result-count').textContent=`${as.length} assessments shown. AI estimates are provisional.`;}});
window.addEventListener('hashchange',route);window.addEventListener('beforeprint',buildPrint);
document.documentElement.dataset.theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.querySelectorAll('[data-theme-button]').forEach(b=>b.textContent=document.documentElement.dataset.theme==='dark'?'Use light mode':'Use dark mode');
route();
</script></body></html>
